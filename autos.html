<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Website | Inloggen</title>

    <link rel="stylesheet" href="auto.css">
    <script src="auto.js" defer></script>
</head>

<body>
    <main>
        <!-- INLOGGEN -->
        <section id="loginPage" class="auth-page">
            <div class="auth-panel">
                <h1>Welkom terug</h1>
                <p>Log in om onze auto's te bekijken.</p>

                <form id="loginForm">
                    <label for="username">Gebruikersnaam</label>
                    <input
                        type="text"
                        id="username"
                        autocomplete="username"
                        required
                    >

                    <label for="password">Wachtwoord</label>
                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="text-button"
                        aria-pressed="false"
                    >
                        Toon wachtwoord
                    </button>

                    <p id="loginError" class="error" role="alert"></p>
                    <p id="loginSuccess" class="success" role="status"></p>

                    <button type="submit" class="full-width">
                        Inloggen
                    </button>
                </form>

                <div class="register-link">
                    <p>Nog geen account?</p>

                    <button
                        type="button"
                        id="showRegister"
                        class="outline-button full-width"
                    >
                        Account maken
                    </button>
                </div>
            </div>
        </section>

        <!-- REGISTREREN -->
        <section id="registerPage" class="auth-page" hidden>
            <div class="auth-panel">
                <h1 id="registerTitle" tabindex="-1">Account maken</h1>
                <p>Kies een gebruikersnaam en wachtwoord.</p>

                <form id="registerForm">
                    <label for="newUsername">Gebruikersnaam</label>
                    <input
                        type="text"
                        id="newUsername"
                        autocomplete="username"
                        minlength="3"
                        maxlength="30"
                        pattern="[A-Za-z0-9_-]{3,30}"
                        title="Gebruik 3 tot 30 letters, cijfers, streepjes of underscores."
                        required
                    >

                    <label for="newPassword">Wachtwoord</label>
                    <input
                        type="password"
                        id="newPassword"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <p class="field-note">
                        Gebruik minimaal 8 tekens.
                    </p>

                    <label for="confirmPassword">
                        Herhaal wachtwoord
                    </label>
                    <input
                        type="password"
                        id="confirmPassword"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <p id="registerError" class="error" role="alert"></p>

                    <button type="submit" class="full-width">
                        Registreren
                    </button>
                </form>

                <button
                    type="button"
                    id="backToLogin"
                    class="text-button back-button"
                >
                    Terug naar inloggen
                </button>
            </div>
        </section>

        <!-- AUTO-OVERZICHT -->
        <section id="carPage" hidden>
            <header class="topbar">
                <h1 id="carTitle" tabindex="-1">Welkom</h1>

                <button type="button" id="logoutButton">
                    Uitloggen
                </button>
            </header>

            <div class="search-box">
                <label for="search">Zoek een auto</label>
                <input
                    type="search"
                    id="search"
                    placeholder="Zoek een auto..."
                >
            </div>

            <div id="carContainer" class="container"></div>

            <p id="noResults" class="no-results" role="status" hidden>
                Geen auto's gevonden.
            </p>
        </section>
    </main>

    <!-- POP-UP -->
    <dialog id="modal" aria-labelledby="modalTitle">
        <button
            type="button"
            id="closeModal"
            class="close"
            aria-label="Pop-up sluiten"
        >
            &times;
        </button>

        <img id="modalImg" alt="">
        <h2 id="modalTitle"></h2>
        <p id="modalInfo"></p>
    </dialog>
</body>
</html>
