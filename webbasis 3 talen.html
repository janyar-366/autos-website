<body>

<div class="container">

    <h1>Registreren</h1>

    <div class="input-box">
        <input type="text" id="voornaam" placeholder="Voornaam">
    </div>

    <div class="input-box">
        <input type="text" id="achternaam" placeholder="Achternaam">
    </div>

    <div class="input-box">
        <input type="email" id="email" placeholder="E-mailadres">
    </div>

    <div class="input-box">
        <input type="password" id="password" placeholder="Wachtwoord">
    </div>

    <div class="input-box">
        <input type="password" id="password2" placeholder="Herhaal wachtwoord">
    </div>

    <button onclick="register()">Account aanmaken</button>

    <a href="login.html" class="loginn-link">
        Al een account? Inloggen
    </a>

</div>

<script>

function register(){

    let voornaam =
    document.getElementById("voornaam").value;

    let achternaam =
    document.getElementById("achternaam").value;

    let email =
    document.getElementById("email").value;

    let password =
    document.getElementById("password").value;

    let password2 =
    document.getElementById("password2").value;

    if(
        voornaam==="" ||
        achternaam==="" ||
        email==="" ||
        password===""
    ){
        alert("Vul alle velden in");
        return;
    }

    if(password !== password2){
        alert("Wachtwoorden komen niet overeen");
        return;
    }

    let gebruiker = {
        voornaam,
        achternaam,
        email,
        password
    };

    localStorage.setItem(
        email,
        JSON.stringify(gebruiker)
    );

    alert("Account succesvol aangemaakt");

    window.location.href="loginn.html";
}

</script>
