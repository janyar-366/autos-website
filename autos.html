<!DOCTYPE html>
<html lang="nl">

<!-- INSTELLINGEN VAN DE PAGINA -->

<head>
    <!-- TEKENCODERING EN MOBIELE WEERGAVE -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- TITEL VAN DE PAGINA -->
    <title>Auto Website | Inloggen</title>

    <!-- CSS-BESTAND KOPPELEN -->
    <link rel="stylesheet" href="auto.css">

    <!-- JAVASCRIPT-BESTAND KOPPELEN -->
    <script src="auto.js" defer></script>
</head>


<!-- INHOUD VAN DE WEBSITE -->

<body>
    <main>

        <!-- INLOGGEN -->

        <section id="loginPage" class="auth-page">
            <div class="auth-panel">

                <!-- TITEL EN WELKOMSTTEKST -->
                <h1>Welkom </h1>
                <p>Log in om onze auto's te bekijken.</p>

                <!-- INLOGFORMULIER -->
                <form id="loginForm">

                    <!-- GEBRUIKERSNAAM -->
                    <label for="username">Gebruikersnaam</label>
                    <input
                        type="text"
                        id="username"
                        autocomplete="username"
                        required
                    >

                    <!-- WACHTWOORD -->
                    <label for="password">Wachtwoord</label>
                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        required
                    >

                    <!-- WACHTWOORD TONEN OF VERBERGEN -->
                    <button
                        type="button"
                        id="togglePassword"
                        class="text-button"
                        aria-pressed="false"
                    >
                        Toon wachtwoord
                    </button>

                    <!-- FOUT- EN SUCCESMELDINGEN -->
                    <p id="loginError" class="error" role="alert"></p>
                    <p id="loginSuccess" class="success" role="status"></p>

                    <!-- INLOGKNOP -->
                    <button type="submit" class="full-width">
                        Inloggen
                    </button>
                </form>

                <!-- LINK NAAR REGISTREREN -->
                <div class="register-link">
                    <p>Nog geen account?</p>

                    <!-- ACCOUNT MAKEN -->
                    <button
                        type="button"
                        id="showRegister"
                        class="outline-button full-width"
                    >
                        Account maken
                    </button>
                </div>
            </div>
        </section>


        <!-- REGISTREREN -->

        <section id="registerPage" class="auth-page" hidden>
            <div class="auth-panel">

                <!-- TITEL VAN HET REGISTRATIESCHERM -->
                <h1 id="registerTitle" tabindex="-1">Account maken</h1>

                <!-- UITLEG BIJ HET REGISTREREN -->
                <p>Kies een gebruikersnaam en wachtwoord.</p>

                <!-- REGISTRATIEFORMULIER -->
                <form id="registerForm">

                    <!-- NIEUWE GEBRUIKERSNAAM -->
                    <label for="newUsername">Gebruikersnaam</label>
                    <input
                        type="text"
                        id="newUsername"
                        autocomplete="username"
                        minlength="3"
                        maxlength="30"
                        pattern="[A-Za-z0-9_-]{3,30}"
                        title="Gebruik 3 tot 30 letters, cijfers, streepjes of underscores."
                        required
                    >

                    <!-- NIEUW WACHTWOORD -->
                    <label for="newPassword">Wachtwoord</label>
                    <input
                        type="password"
                        id="newPassword"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <!-- UITLEG OVER DE WACHTWOORDEISEN -->
                    <p class="field-note">
                        Gebruik minimaal 8 tekens.
                    </p>

                    <!-- WACHTWOORD BEVESTIGEN -->
                    <label for="confirmPassword">
                        Herhaal wachtwoord
                    </label>
                    <input
                        type="password"
                        id="confirmPassword"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <!-- FOUTMELDING BIJ REGISTREREN -->
                    <p id="registerError" class="error" role="alert"></p>

                    <!-- REGISTRATIEKNOP -->
                    <button type="submit" class="full-width">
                        Registreren
                    </button>
                </form>

                <!-- TERUG NAAR HET INLOGSCHERM -->
                <button
                    type="button"
                    id="backToLogin"
                    class="text-button back-button"
                >
                    Terug naar inloggen
                </button>
            </div>
        </section>


        <!-- AUTO-OVERZICHT -->

        <section id="carPage" hidden>

            <!-- TITELBALK EN UITLOGKNOP -->
            <header class="topbar">
                <h1 id="carTitle" tabindex="-1">Welkom</h1>

                <!-- UITLOGGEN -->
                <button type="button" id="logoutButton">
                    Uitloggen
                </button>
            </header>

            <!-- ZOEKVAK VOOR AUTO'S -->
            <div class="search-box">
                <label for="search">Zoek een auto</label>
                <input
                    type="search"
                    id="search"
                    placeholder="Zoek een auto..."
                >
            </div>

            <!-- CONTAINER VOOR DE AUTOKAARTEN -->
            <div id="carContainer" class="container"></div>

            <!-- MELDING ALS ER GEEN AUTO'S GEVONDEN ZIJN -->
            <p id="noResults" class="no-results" role="status" hidden>
                Geen auto's gevonden.
            </p>
        </section>

    </main>


    <!-- POP-UP MET AUTO-INFORMATIE -->

    <dialog id="modal" aria-labelledby="modalTitle">

        <!-- POP-UP SLUITEN -->
        <button
            type="button"
            id="closeModal"
            class="close"
            aria-label="Pop-up sluiten"
        >
            &times;
        </button>

        <!-- AFBEELDING VAN DE AUTO -->
        <img id="modalImg" alt="">

        <!-- TITEL VAN DE AUTO -->
        <h2 id="modalTitle"></h2>

        <!-- INFORMATIE OVER DE AUTO -->
        <p id="modalInfo"></p>

    </dialog>

</body>
</html>
