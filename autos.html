<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Website | Inloggen</title>

    <link rel="stylesheet" href="auto.css">
    <script src="auto.js" defer></script>
</head>

<body>
    <main>
        <!-- INLOGPAGINA -->
        <section id="loginPage" class="login-page">
            <div class="login-panel">
                <h1>Welkom terug</h1>
                <p>Log in om onze auto's te bekijken.</p>

                <form id="loginForm">
                    <label for="username">Gebruikersnaam</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                    >

                    <label for="password">Wachtwoord</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="secondary"
                        aria-pressed="false"
                    >
                        Toon wachtwoord
                    </button>

                    <p id="loginError" class="error" role="alert"></p>

                    <button type="submit">Inloggen</button>
                </form>

                <p class="demo-note">
                    Oefenlogin: janyar / auto123
                </p>
            </div>
        </section>

        <!-- AUTO-OVERZICHT -->
        <section id="carPage" hidden>
            <header class="topbar">
                <h1 id="carTitle" tabindex="-1">Welkom</h1>

                <button type="button" id="logoutButton">
                    Uitloggen
                </button>
            </header>

            <div class="search-box">
                <label for="search">Zoek een auto</label>
                <input
                    type="search"
                    id="search"
                    placeholder="Zoek een auto..."
                >
            </div>

            <div id="carContainer" class="container"></div>

            <p id="noResults" class="no-results" role="status" hidden>
                Geen auto's gevonden.
            </p>
        </section>
    </main>

    <!-- POP-UP -->
    <dialog id="modal" aria-labelledby="modalTitle">
        <button
            type="button"
            id="closeModal"
            class="close"
            aria-label="Pop-up sluiten"
        >
            &times;
        </button>

        <img id="modalImg" alt="">
        <h2 id="modalTitle"></h2>
        <p id="modalInfo"></p>
    </dialog>
</body>
</html>
